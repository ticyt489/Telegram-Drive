
name: Build Linux ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build Debian package on ARM64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90

    env:
      TELEGRAM_DRIVE_SUPPORTER_SERVICE_URL: ${{ vars.SUPPORTER_SERVICE_URL }}
      TELEGRAM_DRIVE_SUPPORTER_PUBLIC_KEY: ${{ vars.SUPPORTER_PUBLIC_KEY }}
      TELEGRAM_DRIVE_CRASH_REPORT_ENDPOINT: ${{ vars.CRASH_REPORT_ENDPOINT }}

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify ARM64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"
          rustc --version || true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Warn if supporter configuration is missing
        if: ${{ vars.SUPPORTER_SERVICE_URL == '' || vars.SUPPORTER_PUBLIC_KEY == '' }}
        run: |
          echo "::warning::SUPPORTER_SERVICE_URL or SUPPORTER_PUBLIC_KEY is missing. Configure these repository variables if the supporter feature is needed."

      - name: Create ARM64 build configuration
        run: |
          cat > app/src-tauri/tauri.arm64-ci.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON

      - name: Build ARM64 Debian package
        working-directory: app
        run: |
          npm run tauri -- build \
            --bundles deb \
            --config src-tauri/tauri.arm64-ci.conf.json

      - name: Verify Debian package architecture
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(app/src-tauri/target/release/bundle/deb/*.deb)

          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Expected one Debian package; found ${#packages[@]}"
            exit 1
          fi

          for package in "${packages[@]}"; do
            arch="$(dpkg-deb -f "$package" Architecture)"
            echo "$package: Architecture=$arch"

            if [[ "$arch" != "arm64" ]]; then
              echo "::error::Expected arm64 package, got $arch"
              exit 1
            fi
          done

      - name: Upload ARM64 package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telegram-drive-linux-arm64-deb
          path: app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
